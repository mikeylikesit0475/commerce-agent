[project]
name = "commerce-agent"
version = "0.1.0"
description = "AI Catalog & Store Assistant Agent powered by Google ADK and LiteLLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.5.0",
    "litellm>=1.93.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests requiring live infrastructure"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
